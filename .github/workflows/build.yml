name: C CI

on:
  push:
    branches: [ "master" ]
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Prep
      run: apt install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libglfw3 libglfw3-dev
    - name: Clean
      run: make clean
    - name: Test
      run: make test
    - name: CPU Diagnostic
      run: make diag
    - name: Build
      run: make package
    - name: Upload
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{github.ref_name}} -t ${{github.ref_name}} -d 8080-emulator.zip
